apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-mongo
spec:
  selector:
    matchLabels:
      app: chat-mongo
  template:
    metadata:
      labels:
        app: chat-mongo
    spec:
      containers:
      - name: mongo
        image: mongo:7
        ports:
        - containerPort: 27017
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: chat-mongo
spec:
  selector:
    app: chat-mongo
  ports:
  - port: 27017
    targetPort: 27017
